name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    # Tests run against real PostgreSQL — the same engine as production.
    # The SQLite fallback they used to rely on was removed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fontscanner
          POSTGRES_PASSWORD: fontscanner_dev
          POSTGRES_DB: fontscanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fontscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_DRIVER: postgres
      TEST_DATABASE_URL: postgresql://fontscanner:fontscanner_dev@localhost:5432/fontscanner_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true  # Advisory only — don't block on transitive dep issues

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # Advisory only. This fails with "Code scanning is not enabled for this
        # repository" until code scanning is turned on in Settings → Security.
        # Publishing a vulnerability report must not gate the pipeline; the Trivy
        # scan step above still surfaces findings in the job log either way.
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # Advisory only — see note in security-scan
        with:
          sarif_file: 'trivy-image-results.sarif'

  # ─────────────────────────────────────────────────────────────────────────────
  # No automated deploy job.
  #
  # Production is a single DigitalOcean droplet running Docker Compose, not a
  # Kubernetes cluster. This file previously carried `deploy-staging` and
  # `deploy-production` jobs that ran `kubectl set image` against
  # `font-scanner.example.com` using `KUBE_CONFIG_STAGING`/`KUBE_CONFIG_PROD`.
  # Neither secret nor cluster has ever existed, so those jobs described
  # infrastructure we do not have. They never actually ran — `lint-and-test` was
  # failing first and short-circuited the pipeline — so the moment lint went
  # green they would have started failing on every push to main.
  #
  # Deploying is a deliberate manual step:
  #
  #   ssh sitemechanic
  #   cd /root/sitemechanic
  #   git pull && docker compose up -d --build && docker compose ps
  #
  # See DEPLOY.md for the full procedure and rollback. The `build-and-push` job
  # above still publishes an image to ghcr.io on every push to main, which is
  # what you roll back to if a deploy goes wrong.
