<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font &amp; Typography Report — Site Mechanic</title>

  <!-- PDF template styles -->
  <link rel="stylesheet" href="/pdf-templates/_pdf-report.css">

  <!-- Google Fonts: Inter for body, DM Serif Text for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Text&display=swap" rel="stylesheet">
</head>
<body class="pdf-report white-theme pdf-export-mode">

  <!-- Page 1: Cover -->
  <section class="pdf-cover" id="cover-page"></section>

  <!-- Page 2: Table of Contents -->
  <section class="pdf-toc" id="toc-page"></section>

  <!-- Page 3: Executive Summary -->
  <section class="pdf-exec" id="exec-summary"></section>

  <!-- Section 1: Font Families -->
  <section class="pdf-section" id="section-families">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 2: Providers & Origins -->
  <section class="pdf-section" id="section-providers">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 3: Font Loading Performance -->
  <section class="pdf-section" id="section-loading">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 4: Privacy & Licensing -->
  <section class="pdf-section" id="section-privacy">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 5: Font Delivery -->
  <section class="pdf-section" id="section-delivery">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 6: Fallback & Layout Stability -->
  <section class="pdf-section" id="section-stability">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 7: Advanced Typography -->
  <section class="pdf-section" id="section-advanced">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 8: Recommendations -->
  <section class="pdf-section" id="section-recommendations">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Scripts -->
  <script src="/i18n.js"></script>
  <script src="/js/report-i18n.js"></script>
  <script src="/js/reportStorage.js"></script>
  <script src="/pdf-templates/_pdf-report.js"></script>
  <script src="/pdf-templates/fonts-report-render.js"></script>

  <script>
    (function () {
      function boot() {
        if (window.PdfReport) {
          window.PdfReport.init();
        } else {
          console.error('[fonts-report] PdfReport not loaded');
          window.__PDF_READY__ = true;
        }
      }
      function waitForI18n() {
        if (window.i18n && window.i18n.initialized) {
          boot();
        } else {
          var attempts = 0;
          var interval = setInterval(function () {
            attempts++;
            if ((window.i18n && window.i18n.initialized) || attempts > 100) {
              clearInterval(interval);
              boot();
            }
          }, 50);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForI18n);
      } else {
        waitForI18n();
      }
    })();
  </script>
</body>
</html>
