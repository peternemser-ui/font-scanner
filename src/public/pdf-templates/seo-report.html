<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Analysis Report — Site Mechanic</title>

  <!-- PDF template styles -->
  <link rel="stylesheet" href="/pdf-templates/_pdf-report.css">

  <!-- Google Fonts: Inter for body, DM Serif Text for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Text&display=swap" rel="stylesheet">
</head>
<body class="pdf-report white-theme pdf-export-mode">

  <!-- Page 1: Cover -->
  <section class="pdf-cover" id="cover-page"></section>

  <!-- Page 2: Table of Contents -->
  <section class="pdf-toc" id="toc-page"></section>

  <!-- Page 3: Executive Summary -->
  <section class="pdf-exec" id="exec-summary"></section>

  <!-- Section 1: Meta Tags -->
  <section class="pdf-section" id="section-meta-tags">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 2: Headings -->
  <section class="pdf-section" id="section-headings">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 3: Content -->
  <section class="pdf-section" id="section-content">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 4: Images -->
  <section class="pdf-section" id="section-images">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 5: Links -->
  <section class="pdf-section" id="section-links">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 6: Mobile -->
  <section class="pdf-section" id="section-mobile">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 7: Structured Data -->
  <section class="pdf-section" id="section-structured-data">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 10: Additional Checks -->
  <section class="pdf-section" id="section-additional">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 11: Recommendations -->
  <section class="pdf-section" id="section-recommendations">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Scripts -->
  <script src="/i18n.js"></script>
  <script src="/js/report-i18n.js"></script>
  <script src="/js/reportStorage.js"></script>
  <script src="/pdf-templates/_pdf-report.js"></script>
  <script src="/pdf-templates/seo-report-render.js"></script>

  <script>
    // Initialize after i18n and DOM are ready
    (function () {
      function boot() {
        if (window.PdfReport) {
          window.PdfReport.init();
        } else {
          console.error('[seo-report] PdfReport not loaded');
          window.__PDF_READY__ = true;
        }
      }

      // Wait for i18n to initialize (or timeout)
      function waitForI18n() {
        if (window.i18n && window.i18n.initialized) {
          boot();
        } else {
          var attempts = 0;
          var interval = setInterval(function () {
            attempts++;
            if ((window.i18n && window.i18n.initialized) || attempts > 100) {
              clearInterval(interval);
              boot();
            }
          }, 50);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForI18n);
      } else {
        waitForI18n();
      }
    })();
  </script>
</body>
</html>
