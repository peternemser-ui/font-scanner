<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Web Vitals Report — Site Mechanic</title>
  <link rel="stylesheet" href="/pdf-templates/_pdf-report.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Text&display=swap" rel="stylesheet">
</head>
<body class="pdf-report white-theme pdf-export-mode">
  <section class="pdf-cover" id="cover-page"></section>
  <section class="pdf-toc" id="toc-page"></section>
  <section class="pdf-exec" id="exec-summary"></section>

  <section class="pdf-section" id="section-score-banner">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-desktop">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-mobile">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-core-vitals">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-additional-metrics">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-best-practices">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-comparison">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-diagnostics">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-recommendations">
    <div class="pdf-section__content"></div>
  </section>
  <section class="pdf-section" id="section-understanding">
    <div class="pdf-section__content"></div>
  </section>

  <script src="/i18n.js"></script>
  <script src="/js/report-i18n.js"></script>
  <script src="/js/reportStorage.js"></script>
  <script src="/pdf-templates/_pdf-report.js"></script>
  <script src="/pdf-templates/core-web-vitals-report-render.js"></script>
  <script>
    (function () {
      function boot() {
        if (window.PdfReport) { window.PdfReport.init(); }
        else { console.error('[cwv-report] PdfReport not loaded'); window.__PDF_READY__ = true; }
      }
      function waitForI18n() {
        if (window.i18n && window.i18n.initialized) { boot(); }
        else {
          var attempts = 0;
          var interval = setInterval(function () {
            attempts++;
            if ((window.i18n && window.i18n.initialized) || attempts > 100) { clearInterval(interval); boot(); }
          }, 50);
        }
      }
      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', waitForI18n); }
      else { waitForI18n(); }
    })();
  </script>
</body>
</html>
