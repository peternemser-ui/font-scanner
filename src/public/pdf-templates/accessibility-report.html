<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Analysis Report — Site Mechanic</title>

  <!-- PDF template styles -->
  <link rel="stylesheet" href="/pdf-templates/_pdf-report.css">

  <!-- Google Fonts: Inter for body, DM Serif Text for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Text&display=swap" rel="stylesheet">
</head>
<body class="pdf-report white-theme pdf-export-mode">

  <!-- Page 1: Cover -->
  <section class="pdf-cover" id="cover-page"></section>

  <!-- Page 2: Table of Contents -->
  <section class="pdf-toc" id="toc-page"></section>

  <!-- Page 3: Executive Summary -->
  <section class="pdf-exec" id="exec-summary"></section>

  <!-- Section 1: Desktop vs Mobile Comparison -->
  <section class="pdf-section" id="section-comparison">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 2: WCAG Compliance Levels -->
  <section class="pdf-section" id="section-wcag-levels">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 3: WCAG Compliance Criteria -->
  <section class="pdf-section" id="section-wcag">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 4: Color Contrast -->
  <section class="pdf-section" id="section-contrast">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 5: Keyboard Navigation -->
  <section class="pdf-section" id="section-keyboard">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 6: ARIA & Semantics -->
  <section class="pdf-section" id="section-aria">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 7: Recommendations & Fix Cards -->
  <section class="pdf-section" id="section-recommendations">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Section 8: Summary -->
  <section class="pdf-section" id="section-summary">
    <div class="pdf-section__content"></div>
  </section>

  <!-- Scripts -->
  <script src="/i18n.js"></script>
  <script src="/js/report-i18n.js"></script>
  <script src="/js/reportStorage.js"></script>
  <script src="/pdf-templates/_pdf-report.js"></script>
  <script src="/pdf-templates/accessibility-report-render.js"></script>

  <script>
    (function () {
      function boot() {
        if (window.PdfReport) {
          window.PdfReport.init();
        } else {
          console.error('[accessibility-report] PdfReport not loaded');
          window.__PDF_READY__ = true;
        }
      }
      function waitForI18n() {
        if (window.i18n && window.i18n.initialized) {
          boot();
        } else {
          var attempts = 0;
          var interval = setInterval(function () {
            attempts++;
            if ((window.i18n && window.i18n.initialized) || attempts > 100) {
              clearInterval(interval);
              boot();
            }
          }, 50);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForI18n);
      } else {
        waitForI18n();
      }
    })();
  </script>
</body>
</html>
