<div class="pro-report-block" data-paid-unlock-card>
  <div class="pro-report-block__header">
    <div class="pro-report-block__title" data-i18n="reports.common.unlockReport">Unlock the full report</div>
    <div class="pro-report-block__subtitle" data-i18n="reports.common.unlockReportSubtitle">No account required. Unlock this report or buy credits to save time.</div>
  </div>

  <div class="pro-report-block__meta">
    <div class="pro-report-block__credits">
      <span data-credits-label data-i18n="reports.common.credits">Credits:</span>
      <span class="pro-report-block__credits-value" data-credit-balance>0</span>
    </div>

    <div class="pro-report-block__unlocked" data-unlocked-badge style="display:none;">
      <span data-i18n="reports.common.unlocked">Unlocked</span>
    </div>
  </div>

  <div class="pro-report-block__actions">
    <button type="button" class="pro-report-block__btn" data-unlock-with-credit style="display:none;" data-i18n="reports.common.unlockWithCredit">
      Unlock with 1 credit
    </button>

    <button type="button" class="pro-report-block__btn" data-buy-single-report style="display:none;" data-i18n="reports.common.unlockFor5">
      Unlock for $5
    </button>

    <button type="button" class="pro-report-block__btn pro-report-block__btn--secondary" data-open-pricing-modal data-i18n="reports.common.goPro30">
      Go Pro — $30/mo
    </button>
  </div>

  <div class="pro-report-block__footer">
    <div class="pro-report-block__unlocked-method" data-unlocked-method style="display:none;"></div>
  </div>
</div>
