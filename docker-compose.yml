version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: font-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitemechanic
      POSTGRES_USER: ${POSTGRES_USER:-smuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - font-scanner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smuser} -d sitemechanic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  font-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: font-scanner-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

      # Database
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://${POSTGRES_USER:-smuser}:${POSTGRES_PASSWORD}@db:5432/sitemechanic

      # Auth
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - DOWNLOAD_TOKEN_SECRET=${DOWNLOAD_TOKEN_SECRET:?Set DOWNLOAD_TOKEN_SECRET in .env}

      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY:-}
      - STRIPE_PRICE_SINGLE_REPORT=${STRIPE_PRICE_SINGLE_REPORT:-}
      - STRIPE_PRICE_DAY_PASS=${STRIPE_PRICE_DAY_PASS:-}
      - PAYMENT_DEMO_MODE=false

      # App
      - APP_BASE_URL=${APP_BASE_URL:?Set APP_BASE_URL in .env}
      - CORS_ORIGIN=${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      - BILLING_ALLOWED_RETURN_HOSTS=${BILLING_ALLOWED_RETURN_HOSTS:-}

      # OAuth (Social Login)
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - FACEBOOK_OAUTH_APP_ID=${FACEBOOK_OAUTH_APP_ID:-}
      - FACEBOOK_OAUTH_APP_SECRET=${FACEBOOK_OAUTH_APP_SECRET:-}

      # Puppeteer
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_TIMEOUT=${PUPPETEER_TIMEOUT:-30000}

      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}

      # Reports
      - REPORTS_DIR=/app/reports
      - REPORTS_RETENTION_DAYS=${REPORTS_RETENTION_DAYS:-7}

      # Performance
      - MAX_PAGES_TO_SCAN=${MAX_PAGES_TO_SCAN:-10}
      - SCAN_TIMEOUT=${SCAN_TIMEOUT:-60000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # AI (optional)
      - AI_ENABLED=${AI_ENABLED:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - reports-data:/app/reports
      - logs-data:/app/logs
      - temp-data:/app/temp
    networks:
      - font-scanner-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  pg-data:
    driver: local
  reports-data:
    driver: local
  logs-data:
    driver: local
  temp-data:
    driver: local

networks:
  font-scanner-network:
    driver: bridge
